[project]
name = "machine-learning-zoomcamp-2026"
version = "0.1.0"
description = "Homework solutions and projects for Machine Learning Zoomcamp 2026 (DataTalksClub)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel",
    "marimo",
    "matplotlib",
    "nbformat>=5.10.4",
    "numpy",
    "pandas>=3.0.3",
    "python-dotenv>=1.1",
    "requests",
    "scikit-learn",
    "seaborn",
    "tqdm",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    "*.ipynb",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
